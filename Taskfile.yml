version: "3"

shopt: [globstar]

vars:
  LUA_FILES: lib/**/*.lua plugins/**/*.lua test/**/*.lua dev/**/*.lua
  LUA_TESTS: test/**/*.test.lua
  GO_FILES: cmd/**/*.go internal/**/*.go

tasks:
  default:
    cmds:
      - task --list

  check:
    desc: Everything CI checks, in the same order
    cmds:
      - task: rules
      - task: lua
      - task: go

  rules:
    desc: ASCII only, no comments, in Lua and Go files
    cmds:
      - go run ./cmd/ma2kit check-rules {{.LUA_FILES}} {{.GO_FILES}}

  lua:
    desc: Lua format check, lint and tests
    cmds:
      - task: lua:format
      - task: lua:lint
      - task: lua:test

  lua:format:
    desc: StyLua format check
    cmds:
      - stylua --check .

  lua:lint:
    desc: luacheck
    cmds:
      - luacheck .

  lua:test:
    desc: LuaUnit tests on Lua 5.3
    cmds:
      - lua53 test/run.lua {{.LUA_TESTS}}

  go:
    desc: Go lint and tests
    cmds:
      - task: go:lint
      - task: go:test

  go:lint:
    desc: golangci-lint with every linter on
    cmds:
      - golangci-lint run ./cmd/... ./internal/...

  go:test:
    desc: Go tests
    cmds:
      - go test ./cmd/... ./internal/...

  fmt:
    desc: Format all Lua and Go files
    cmds:
      - stylua .
      - golangci-lint fmt ./...

  build:
    desc: Build ma2kit into dist/
    cmds:
      - go build -o dist/ma2kit{{exeExt}} ./cmd/ma2kit
