version: "3"

shopt: [globstar]

vars:
  LUA_FILES: lib/**/*.lua plugins/**/*.lua test/**/*.lua
  LUA_TESTS: test/**/*.test.lua
  GO_FILES: cmd/**/*.go internal/**/*.go
  PLUGINS: channel-to-fixture fixture-to-channel
  GOLDEN_COMMIT: abc1234
  GOLDEN_DATE: "2026-10-24"

tasks:
  default:
    cmds:
      - task --list

  check:
    desc: Everything CI checks, in the same order
    cmds:
      - task: rules
      - task: lua
      - task: go

  rules:
    desc: ASCII only, no comments, in Lua and Go files
    cmds:
      - go run ./cmd/ma2kit check-rules {{.LUA_FILES}} {{.GO_FILES}}

  lua:
    desc: Lua format check, lint and tests
    cmds:
      - task: lua:format
      - task: lua:lint
      - task: lua:test

  lua:format:
    desc: StyLua format check
    cmds:
      - stylua --check .

  lua:lint:
    desc: luacheck
    cmds:
      - luacheck .

  lua:test:
    desc: LuaUnit tests on Lua 5.3
    cmds:
      - lua53 test/run.lua {{.LUA_TESTS}}

  go:
    desc: Go lint and tests
    cmds:
      - task: go:lint
      - task: go:test

  go:lint:
    desc: golangci-lint with every linter on
    cmds:
      - golangci-lint run ./cmd/... ./internal/...

  go:test:
    desc: Go tests
    cmds:
      - go test ./cmd/... ./internal/...

  fmt:
    desc: Format all Lua and Go files
    cmds:
      - stylua .
      - golangci-lint fmt ./...

  coverage:
    desc: Go test coverage per package and the total
    cmds:
      - mkdir -p dist
      - go test -coverprofile=dist/coverage.out ./cmd/... ./internal/...
      - go tool cover -func=dist/coverage.out

  build:
    desc: Build ma2kit into dist/
    cmds:
      - go build -o dist/ma2kit{{exeExt}} ./cmd/ma2kit

  bundle:
    desc: Build every plugin into dist/
    cmds:
      - |
        for plugin in {{.PLUGINS}}; do
          go run -buildvcs=true ./cmd/ma2kit bundle $plugin --out dist
        done

  golden:
    desc: Rebuild the committed bundles in test/bundles
    cmds:
      - |
        for plugin in {{.PLUGINS}}; do
          go run -buildvcs=true ./cmd/ma2kit bundle $plugin --out test/bundles \
            --commit {{.GOLDEN_COMMIT}} --date {{.GOLDEN_DATE}}
        done

  install:
    desc: Run every check, then install a plugin into MA2
    cmds:
      - task: check
      - go run -buildvcs=true ./cmd/ma2kit install {{.CLI_ARGS}}

  tui:
    desc: Run every check, then pick the plugins in a small window
    cmds:
      - task: check
      - go run -buildvcs=true ./cmd/ma2kit tui {{.CLI_ARGS}}

  dist:
    desc: Build the distribution bundle with the installer and the plugins
    cmds:
      - go build -o dist/bundle/install{{exeExt}} ./cmd/setup
      - go run -buildvcs=true ./cmd/ma2kit bundle --all --out dist/bundle
      - go run -buildvcs=true ./cmd/ma2kit manifest --out dist/bundle
      - ls -la dist/bundle
