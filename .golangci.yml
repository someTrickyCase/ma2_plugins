version: "2"

linters:
  default: all
  disable:
    - exhaustruct
    - gomodguard
    - wsl
  settings:
    lll:
      line-length: 80
      tab-width: 4
    depguard:
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - github.com/someTrickyCase/ma2_plugins
            - github.com/charmbracelet/bubbletea
            - github.com/charmbracelet/lipgloss
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - github.com/charmbracelet/bubbletea
    revive:
      enable-all-rules: true
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: add-constant
          arguments:
            - allowInts: "0,1"
  exclusions:
    paths:
      - scratch$
      - dist$

formatters:
  enable:
    - gofumpt
    - goimports
