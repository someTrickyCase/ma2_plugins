name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  TASK_VERSION: 3.54.0
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lua:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.3.6"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck 1.2.0-1

      - name: Name Lua lua53, like on Windows
        run: ln -s "$(command -v lua)" "$(dirname "$(command -v lua)")/lua53"

      - name: Install StyLua
        env:
          RELEASES: https://github.com/JohnnyMorganz/StyLua/releases/download
          VERSION: v2.3.1
        run: |
          curl -fsSL -o stylua.zip \
            "$RELEASES/$VERSION/stylua-linux-x86_64.zip"
          unzip -q stylua.zip -d "$HOME/bin"
          rm stylua.zip
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lua checks
        working-directory: repo
        run: task lua

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        env:
          INSTALLER: https://golangci-lint.run/install.sh
        run: |
          curl -fsSL "$INSTALLER" \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"

      - uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Go checks
        run: task go

      - name: Code rules
        run: task rules

      - name: Go coverage
        run: task coverage
